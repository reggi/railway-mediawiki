AllowEncodedSlashes NoDecode

<Directory /var/www/html>
    RewriteEngine On
    RewriteRule ^/?social-cards/([1-9][0-9]*)/([a-f0-9]{64})\.png$ /index.php?title=Special:SocialCard/$1/$2.png [L]
    RewriteRule ^/?wiki(/.*)?$ /index.php [L]
</Directory>

<Directory /var/www/html/images/social-cards>
    Require all denied
</Directory>
