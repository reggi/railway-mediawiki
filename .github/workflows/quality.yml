name: Repository quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Prettier, package.json, and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Knitto configuration and compliance
        run: |
          KNITTO_VERSION="$(node -p "require('./.knitto.json').engine.version")"
          npx --yes --package="knitto@$KNITTO_VERSION" -- \
            knitto check "$GITHUB_WORKSPACE" --update

      - name: Check repository quality
        run: npm run test:quality
